<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <clipPath id="dial"><circle cx="512" cy="540" r="250"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#0C0D10"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- mark -->
  <g id="mark">
    <circle cx="512" cy="540" r="290" fill="none" stroke="#818CF8" stroke-width="22" opacity="0.35"/>
    <g clip-path="url(#dial)">
      <g transform="rotate(-12 512 540)">
        <rect x="200" y="240" width="624" height="320" fill="url(#sky)"/>
        <rect x="200" y="560" width="624" height="320" fill="url(#ground)"/>
        <rect x="200" y="553" width="624" height="14" fill="#E0E7FF"/>
        <rect x="452" y="470" width="120" height="8" rx="4" fill="#E0E7FF" opacity="0.8"/>
        <rect x="472" y="420" width="80" height="8" rx="4" fill="#E0E7FF" opacity="0.6"/>
        <rect x="452" y="640" width="120" height="8" rx="4" fill="#E0E7FF" opacity="0.5"/>
      </g>
    </g>
    <circle cx="512" cy="540" r="250" fill="none" stroke="#C7D2FE" stroke-width="14"/>
    <!-- fixed aircraft symbol -->
    <path d="M352 546 H470 L512 588 L554 546 H672" fill="none" stroke="#FBBF24" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="546" r="16" fill="#FBBF24"/>
    <!-- bank pointer -->
    <path d="M512 258 L492 222 H532 Z" fill="#FBBF24"/>
  </g>
</svg>
